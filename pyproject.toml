[project]
name = "game-market-chatbot"
version = "0.1.0"
description = "Conversational video game market analysis chatbot"
readme = "README.md"
authors = [
    { name = "", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "pyturso>=0.7.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.35.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "turso-serverless>=0.1.0",
]

[project.scripts]
game-market-chatbot = "game_market_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
